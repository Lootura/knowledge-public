    const payload = document.getElementById('home-feature-data');

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let activeIndex = 0;
    let isTransitioning = false;

    const replaceSuggestions = (feature) => {
      if (!suggestions) return;
      suggestions.replaceChildren(document.createTextNode('Suggested searches: '));

        const suggestionLink = document.createElement('a');
        suggestionLink.className = 'font-semibold text-white underline-offset-4 hover:underline';
        suggestionLink.href = `${entitiesPath}?q=${encodeURIComponent(suggestion)}`;
        suggestionLink.textContent = suggestion;
        suggestions.appendChild(suggestionLink);
        if (index < list.length - 1) suggestions.appendChild(document.createTextNode(', '));
      });
    };

    const setFeature = (feature, immediate = false) => {
      if (!feature || isTransitioning) return Promise.resolve();

      const nextImage = feature.imageUrl;
      const updateText = (visible = true) => {
        if (!suggestions) return;
        replaceSuggestions(feature);
        suggestions.classList.toggle('opacity-0', !visible);
        suggestions.classList.toggle('translate-y-1', !visible);
      };

      if (!image || !nextImage || image.getAttribute('src') === nextImage) {
        if (immediate || reduceMotion) {
          updateText(true);
          return Promise.resolve();
        }

        isTransitioning = true;
        suggestions?.classList.add('opacity-0', 'translate-y-1');
        window.setTimeout(() => {
          updateText(true);
          isTransitioning = false;
        }, Math.round(transitionMs * 0.35));
        return Promise.resolve();
      }

      if (immediate || reduceMotion) {
        image.src = nextImage;
        if (nextImageLayer) nextImageLayer.src = nextImage;
        updateText(true);
        return Promise.resolve();
      }

      isTransitioning = true;
      suggestions?.classList.add('opacity-0', 'translate-y-1');

      return new Promise((resolve) => {
        const preload = new Image();
        preload.onload = () => {
          if (!nextImageLayer) {
            image.src = nextImage;
            updateText(true);
            isTransitioning = false;
            resolve();
            return;
          }

          nextImageLayer.src = nextImage;
          requestAnimationFrame(() => {
            nextImageLayer.classList.remove('opacity-0');
            window.setTimeout(() => updateText(true), Math.round(transitionMs * 0.22));
            window.setTimeout(() => {
              image.src = nextImage;
              nextImageLayer.classList.add('opacity-0');
              isTransitioning = false;
              resolve();
            }, transitionMs);
          });
        };
        preload.onerror = () => {
          updateText(true);
          isTransitioning = false;
          resolve();
        };
        preload.src = nextImage;
      });
    };

    if (featureData.length > 0) {
      const lastIndex = Number(sessionStorage.getItem('lootura:homeFeatureIndex') || '-1');
      let nextIndex = Math.floor(Math.random() * featureData.length);
      if (featureData.length > 1 && nextIndex === lastIndex) nextIndex = (nextIndex + 1) % featureData.length;
      activeIndex = nextIndex;

          sessionStorage.setItem('lootura:homeFeatureIndex', String(activeIndex));
          setFeature(featureData[activeIndex]);
        }, rotationMs);
      }
    }
